[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lanmsg"
version = "0.1.0"
description = "Focused, self-hosted text chat for small groups"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
desktop = ["pywebview>=5,<7"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
lanmsg = "lanmsg.server:main"
lanmsg-desktop = "lanmsg.desktop:main"

[tool.setuptools.package-data]
lanmsg = ["static/*"]

[tool.setuptools.packages.find]
include = ["lanmsg*"]
